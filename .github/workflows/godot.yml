name: Godot client

# Quick check of the Godot 4 client (godot/) on every push that touches it: Web, Linux, Windows and a
# debug Android APK (Gradle build). The full store builds (signed APK + AAB, Epic, iOS) are made by
# release.yml (dry run: `gh workflow run release.yml --ref <branch>`).
on:
  workflow_dispatch:
  push:
    paths: ['godot/**', 'scripts/godot-version.mjs', '.github/actions/godot-prepare/**', '.github/workflows/godot.yml']

env:
  GODOT_VERSION: 4.4.1
  WINEPREFIX: /tmp/wine # rcedit (Windows icon) runs under wine, which refuses HOME=/github/home
  WINEDEBUG: -all

defaults:
  run:
    shell: bash

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-prepare
      - name: Web
        run: mkdir -p godot/build/web && godot --headless --path godot --export-release "Web" build/web/index.html
      - name: Linux
        run: mkdir -p godot/build/linux-steam && godot --headless --path godot --export-release "Linux (Steam)" build/linux-steam/AISlopArena.x86_64
      - name: Windows
        run: mkdir -p godot/build/windows-steam && godot --headless --path godot --export-release "Windows (Steam)" build/windows-steam/AISlopArena.exe
      - name: Android (debug keystore)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p godot/build/android
          godot --headless --path godot --export-debug "Android" build/android/AISlopArena-android.apk
          test -s godot/build/android/AISlopArena-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: godot-builds
          path: godot/build/**
          retention-days: 7
